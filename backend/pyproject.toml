[project]
name = "offerpilot-backend"
version = "0.1.0"
description = "OfferPilot 秋招求职助手 - FastAPI 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "redis>=5.0",
    "loguru>=0.7",
    "python-multipart>=0.0.9",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
# B008: FastAPI 依赖注入在参数默认值中使用 Depends() 是官方推荐写法
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
